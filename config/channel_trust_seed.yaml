# Editorial channel trust scores for `youtube_channels.trust_score`.
#
# Run `python3 -m scripts.seed_trust_scores` to apply this file to the live DB.
# The script is idempotent — re-running with the same content is a no-op.
#
# Tier guidance:
#   0.9 — trusted: long-running track record, technical clarity, consistent accuracy.
#   0.6 — standard: solid analysis but mixed signal-to-noise.
#   0.3 — probationary: noisy / new / unverified channels worth keeping but not boosting.
#   0.0 — disabled (would also need approved=0; this script only writes trust_score).
#
# All 13 current channels are seeded with `default_trust: 1.0` so the live ranking is
# unchanged at W2 deploy time. Per CEF-1 in the discover plan, C-C3's distinction
# between yt_curated (≥0.7) and yt (<0.7) is operationally inert until the operator
# differentiates these values. Edit and rerun before W3 flips out of shadow mode.

default_trust: 1.0

