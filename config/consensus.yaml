# Wolf macro-brain (#news lane). Phase-1 = reader -> thesis -> #news alert.
# Everything OFF by default: gmail_watcher.enabled:false gates ingestion, and
# wolf.dry_run:true means alerts are logged, never posted to Discord.
wolf:
  dry_run: false                        # LIVE — posts to #news (user sign-off 2026-06-01)
  enable_critical_ping: true            # phase-2 LIVE — @-ping on critical confluence (user sign-off 2026-06-01)
  extraction_max_tokens: 4096
  # Input cap: how many chars of the email body the extractor reads. Raised
  # 12000 -> 40000 on 2026-06-05: 26 of 94 real emails exceeded 12000 (largest
  # 31934), and the big "Daily Wrap" editions front-load macro text and put the
  # actual trade calls AFTER char 12000 — at 12000 the largest email yielded 0
  # theses, at 40000 it recovered real ideas (WTI, REMX, URA, BTC). 40000 chars
  # ~= 10k tokens (trivial for the chain's 130k-1M context); output stays small
  # (~700 tokens) so extraction_max_tokens=4096 is still ample. Used in BOTH the
  # extractor and the quote-verifier (wolf_email_parser) — keep them in sync.
  extraction_input_cap: 40000
  extraction_timeout: 60
  vision:                               # #19/#4 chart-read config (OpenRouter vision)
    enabled: true                       # item A LIVE (user go 2026-06-09): read Wolf charts.
    rotation_helps: false               # single paid model — nothing to rotate.
    pace_seconds: 8                     # delay between charts in one email's burst
    per_chart_budget_seconds: 600       # per-chart wall-clock cap (then skip-for-now)
    max_attempts_per_chart: 6           # attempt ceiling per chart (paid model is reliable)
    max_output_tokens: 512              # cap output; thinking disabled in code (wolf_vision.py)
    models:                             # PAID ONLY (user 2026-06-09): the :free variants all share
                                        #   OpenRouter's throttled free upstream (429 "rate-limited
                                        #   upstream, add your own key") and are unreliable — do NOT
                                        #   use them for Wolf charts. gemini-2.5-flash-lite reads a
                                        #   real chart cleanly for ~0.03c each ($0.10/1M in, $0.40/1M
                                        #   out; ~2k in + ~220 out per chart).
      - "google/gemini-2.5-flash-lite"
    paid_fallback_model: ""             # unused — the pool above is already the paid reader.
  # Dedicated chain for thesis extraction (own chain, NOT the shared role="primary"
  # chain). Leads with gpt-oss-120b: 2026-06-02 it honored the stricter "skip
  # daily-performance mentions" prompt 4/4 (no false GOOG bull) where the weaker
  # deepseek-v4-flash had over-extracted. deepseek/free kept as fallbacks.
  # 2026-07-12: same model, PAID tier. The :free tier 429d 2/4 on a real 33k-char
  # transcript (188 failures vs 1 success in the 07-05..07-10 logs), so extraction
  # was silently demoting to deepseek — the very model this chain leads with
  # gpt-oss-120b to avoid.
  extraction_models:
    - "openai/gpt-oss-120b"
    - "deepseek/deepseek-v4-flash"
    - "openrouter/free"
  extraction_retries: 2                   # in-code default was 2; made explicit here
  # #64 extractor->verifier rebuild (trap-proof reader). The extractor is now sampled
  # N times (self-consistency vote) and each surviving thesis is checked by a
  # DISCRIMINATIVE cross-family verifier that can only VETO/DOWNGRADE a thesis, never
  # mint one. Gated behind wolf.verifier.enabled. See todo/wolf-extractor-verifier-rebuild.md.
  verifier:
    enabled: true                         # LIVE 2026-07-05 — eval-corpus gate PASSED: fixes the IGV
                                          #   incident false-bull the shipped extractor STILL gets wrong
                                          #   (bull->bear), recovers the IGV bear 3/3, zero false bulls,
                                          #   no net-new invented theses. Owed live check: watch the next
                                          #   few real Wolf emails — the pipeline is stricter (drops
                                          #   hedged/weak calls); flip back to false to roll back.
    samples: 3                            # extractor sample count for the consistency vote
    sample_temperature: 0.4               # temp for samples 2..N (sample 1 stays at 0.1)
    # Cross-family judge: Gemini is a DIFFERENT family from the gpt-oss/deepseek
    # extractor, so its errors are uncorrelated (the veto is the anti-trap). GLM-free
    # went 404/paid 2026-07-05; flash-lite (already the paid Wolf-vision reader) is the
    # reliable same-family-but-cheap fallback.
    models:
      - "google/gemini-2.5-flash"
      - "google/gemini-2.5-flash-lite"
    max_tokens: 1500
    timeout: 60
    # Curated-source gate: the judge ONLY drops a call it flags as wrong-direction (contradict)
    # or as a recap mention — a hedged/tentative Wolf call is never dropped (he posts only
    # quality). min_agreement is now just a PHASE-confidence threshold: below this sample-vote
    # fraction a plain view is capped at phase=pending (never marked 'active'), never dropped.
    min_agreement: 0.5
  sprawl_caps:                          # max active theses per scope
    market: 10
    sector: 20
    stock: 30
    asset: 12
  conviction:                           # Wolf-over-time conviction tracker (TODO #20, phase 1)
    window_days: 10                     # trailing window for the mention-frequency (distinct-day) score term
    trajectory_threshold: 8             # |conviction delta| below this is "stable" absent a structural change
    narrate: false                      # OFF by default — templated render is the product; LLM gloss is phase-2
  confluence:                           # Cross-source confluence (TODO #20, phase 2 / Type-2)
    enabled: true                       # LIVE (user sign-off 2026-06-01)
    interval_sec: 900                   # re-check active theses every 15 min (cheap, no LLM)
    window_days: 21                     # "last 2-3 weeks" — agreement only counts recent calls
    min_dominance: 0.6                  # a source's net vote needs >=60% one-sided rows, else it's "mixed"
    board_show_levelless: true          # #3A LIVE (user go 2026-06-08) — show corroborated (agree>=2) theses even with no levels
    links_enabled: true                 # #3B LIVE (user go 2026-06-08) — clickable YouTube links by agreeing videos
    weighted_votes_enabled: true        # I15 LIVE 2026-06-15 — dry-run on current theses: 0 tier changes, 0 new criticals; non-actor-critical guard intact
    require_nonactor_for_critical: true # I15 — critical @-ping needs >=1 non-actor-controllable source
    timing:                             # #20 timing gate: WHEN a standing thesis becomes a trade
      collect: true                     # SHADOW — widen the roster + store the verdict. Changes nothing a user sees.
      enabled: false                    # OFF — an 'act' verdict may NOT raise the alert tier. Flip only after
                                        # scripts/wolf_timing_backtest.py shows gated entry beats raw-Wolf entry on the
                                        # decision_snapshots 5d/20d labels. If it does not, this stays OFF permanently
                                        # (honest-negative clause — no re-tuning the threshold until it passes).
  outcomes:                             # Wolf Sunday-recap outcome grading
    benchmark_adjusted: true            # I16 LIVE 2026-06-10 — credit "moved_with" only when proxy beats its benchmark (raw still shown); live-tested on the real 13 theses (SMH bear: moved_against -> flat-vs-benchmark)
  direction_guard:                      # #1 trade-stance vs near-term-price-path extraction rule
    enabled: true                       # LIVE (user go 2026-06-08) — fixes IGV-style bull/bear misreads (topping-context override added 2026-06-13)
  staleness:                            # #26 nightly sweep — DEMOTE (not delete) theses Wolf has gone quiet on
    enabled: true                       # LIVE 2026-06-15 — dry-run validated vs live DB (demotes 8 genuinely-stale theses, leaves fresh)
    cap_days:                           # stage-split age caps (days since last EXPLICIT same-direction reaffirmation)
      forming: 30
      diverging: 30
      imminent: 18                      # an "imminent" call gone quiet for weeks itself signals it didn't pan out
      acting: 90                        # already in the trade -> long leash (still target/contradiction-aware)
    target_reached_stale_days: 7        # price hit a stated target + no real reaffirm in N days -> demote
    contradiction_enabled: true         # demote a stale thesis contradicted by a higher-conviction opposite on the same complex
    contradiction_stale_days: 14        # ...only once it has been quiet at least this long
  digests:                              # Scheduled #news briefings (TODO #20, phase 3)
    enabled: true                       # LIVE — posts midday/nightly/Sunday digests to #news (user sign-off 2026-06-01)
    narrate: false                      # optional <=2-sentence LLM takeaway; OFF (templated render is the product)
    midday_window_pt: ["12:00", "13:05"]    # post ~1 min after Wolf's midday email lands
    nightly_window_pt: ["19:00", "02:00"]   # crosses midnight — the long evening "Wrap"
    sunday_recap_pt: "10:00"            # clock-based weekly recap (Sun >= 10am PT)
    outcome_lookback_days: 7            # Sunday recap scores theses actionable within this window
    max_theses_per_field: 8            # cap embed field length
  beneficiaries:                        # Inferred beneficiary LONGs per macro/sector thesis (TODO #20, phase 4 / #2)
    enabled: true                       # LIVE — runs the precompute loop + populates wolf_beneficiaries (user sign-off 2026-06-02)
    surface_in_digest: true             # LIVE — beneficiaries section posts in #news digests (user sign-off 2026-06-02, went live skipping shadow-run)
    compute_interval_sec: 900           # precompute cycle cadence
    per_thesis_throttle_sec: 3600       # recompute a given thesis at most hourly
    digest_max_age_sec: 7200            # digest omits rows older than this (engine-was-down guard)
    rs_window_days: 21                  # 1-month peer-relative RS (user choice; see plan flag #1 — 63d was the research rec)
    abs_rs_floor: 0.5                   # candidate must beat peers by >0.5pp to be eligible (no manufactured winners)
    top_k: 3                            # max longs surfaced per thesis
    conf_floor: 0.40                    # below this confidence => dropped
    extended_pct: 45                    # anti-chase guard: a name already up >=45% over the window is parabolic/mean-reversion-prone -> dampened + capped at 🟡 (never 🟢) + flagged in the reason
    extended_penalty: 0.7               # confidence multiplier applied to an extended (>=extended_pct) name
    confluence_max_age_sec: 86400       # confluence multiplier only applies if the check is this fresh
    use_catalyst: true                  # news-catalyst confidence lift (read-only news_cascade)
    use_flow: true                      # options-flow confidence lift (read-only)
    shorts_enabled: true                # #6 LIVE (user go 2026-06-08) — SHORT ideas on bear theses (~5 eligible index/sector bears)

# Command handler concurrency limits (plan section 2G).
commands:
  outer_concurrency: 4   # max simultaneous handler entries
  inner_concurrency: 64  # max simultaneous background tasks

# TweetShift listener hardening (plan section 2H).
tweetshift:
  pre_ready_buffer_cap: 100  # max messages buffered before READY fires
  ack_reaction: "👀"  # "thinking" emoji added to a question/command while answering; "" disables

# ---------------------------------------------------------------------------
# Reliability-hardening run (2026-06-29). New top-level knobs. Alert-affecting
# fixes default OFF until their owed live check is done (shadow-log first);
# pure-internal ones (http/yahoo/jitter) carry safe defaults and are active on
# deploy. See .claude/discover/reliability-hardening/final-plan.md.
# ---------------------------------------------------------------------------
http:
  default_timeout_total_s: 30   # C11: shared aiohttp session default total timeout (sock_read was None -> hang vector)

yahoo:
  max_concurrency: 3            # C20: process-wide cap on concurrent unauth yfinance fetches

rate_limiter:
  jitter_mode: "equal"          # C1: equal jitter on backoff ("equal" | "none")

circuit_breaker:
  enabled: true                 # C2/C5 LIVE 2026-07-04 (7-day soak: only exa is dead=1296 backoffs, other 3 sources=0; none are instant-alert triggers so no real alert can be silenced)
  fail_max: 5                   # consecutive transient failures before OPEN
  reset_timeout_s: 120          # cooldown before a self-driven half-open probe
  hard_max_open_s: 1800         # absolute cap on any OPEN (recovery-first)

retry:
  use_classifier: true          # C3: classify failures + honor a (capped) server Retry-After — LIVE 2026-07-04 (7-day soak: internal-only, cannot drop/block an alert)
  llm_retry_after_cap_s: 120    # C3: cap a Retry-After applied to an LLM provider bucket

dead_source:
  ops_alert_enabled: true       # C5 LIVE 2026-07-04 (ops alert on a dead source; informational, cannot block an alert)
  # ops_channel_id: ""          # #71: unused now — the alert routes to discord.errors_channel_id

# #71: outage/error alerts. NOT stock signals — these say something is broken.
# Fire on a state TRANSITION only (down -> one alert, silence, recovery -> one note),
# with the state persisted in `ops_alert_state` so a restart mid-outage cannot re-ping.
# Classes in ops_alert.MENTION_CLASSES (schwab_*, llm_health) @-mention the owner;
# everything else posts quietly.
ops_alerts:
  enabled: true                 # master switch for every #errors post
  min_interval_s: 3600          # quiet window: after an alert, the same thing can't
                                # re-raise a "broken" for 1 hour. So Schwab breaking
                                # every 10 min all afternoon costs one broken + one
                                # recovered message per hour, not one per bounce.
                                # A changed failure class bypasses it. A "recovered"
                                # note is only sent when its matching "broken" alert
                                # actually went out.
                                # No #errors post ever @-mentions the user (2026-07-12).

adapters:
  report_failure: true          # C14: precision adapters feed failures to the shared rate_limiter — LIVE 2026-07-04 (7-day soak: internal-only)

schwab:
  reauth_warn_days: 2   # #57 warn N days before the 7-day Schwab refresh-token expires
