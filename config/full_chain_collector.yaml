# TODO #109. Non-secret settings for the forward options-data collector.

universe:
  trade_names:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AVGO
    - AMD
    - NFLX
    - MU
    - QCOM
    - INTC
    - PLTR
    - CRM
    - ORCL
    - SMCI
    - COIN
    - NOW
    - PANW
  option_context:
    - SPY
    - QQQ
  stock_context:
    - SPY
    - QQQ
    - XLK
    - SMH
  # The only verified free OptionsDX file is one partial 2020 SPY session.
  # That cannot replace forward SPX collection.
  collect_spx_forward: true

capture:
  strike_band_pct: 0.15
  nearest_expirations: 4
  # Large enough to cover the full 15% downside band on SPX in the live probe.
  strike_count: 500
  option_workers: 6
  data_root: /home/openclaw/.openclaw/research-data/todo-109

local_history:
  minute_data: missing
  daily_data: present_for_all_trade_names_and_context
  note: The repository has daily JSON history, but data/mmhl_minute does not exist.

# M0.2B offline storage remains opt-in. These are enforced byte ceilings, not
# measured daily sizes and not permission to remove any saved data.
storage:
  bounded_compaction_enabled: false
  cleanup_enabled: false
  cleanup_result_bytes: 16384
  fixed_reserve_bytes: 12000000000
  reserve_fraction: 0.15
  peak_memory_bytes: 1500000000
  batch_bytes: 256000000
  wall_seconds: 1800
  output_bounds:
    chain_bytes: 1000000000
    scratch_bytes: 4500000000
    open_interest_bytes: 200000000
    proof_bytes: 4000000
    publication_bytes: 4096
