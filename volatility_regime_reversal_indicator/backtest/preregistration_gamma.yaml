# =============================================================================
# PHASE-GAMMA PRE-REGISTRATION — dealer-gamma fragility TOPS (negative gamma ->
# price break) + dark-pool accumulation BOTTOMS (high dix after capitulation).
# Frozen contract. (TODO #47, the LAST free-data lever.)
# =============================================================================
# Separate from the FROZEN Phase-1/2/3/4 contracts, which are untouched, as are
# their tests.
#
# HONESTY DISCLOSURE (load-bearing — read first):
# Phases 1, 2 and 3 all came back NO-GO; the QQQ cross-asset transfer and the
# benchmark battle were the killers. The research mission concluded the genuine
# TOP signal needs DECOMPOSED option-surface + DEALER-GAMMA + true-breadth data the
# project lacked. Dealer-hedging fragility (dealer gamma) is the ONE such input we
# now have for FREE and that is NOT VIX-derived — every prior free leg was
# VIX/sentiment. This phase tests it under the SAME honesty machinery: the
# opportunity-set null, the temporal hold-out, the QQQ cross-asset transfer (the
# binding constraint that killed Phase 2/3), the benchmark battle, and the alert
# budget. The constructions/thresholds are round, defensible, NOT re-tuned (gex<0 is
# the canonical negative-gamma line; {0.20,0.90} trailing-252 percentiles; {20,50}-day
# MAs). A NO-GO is an acceptable, honest, LIKELY outcome (ship DESCRIPTIVE-ONLY).
#
# COVERAGE LIMITATION (disclosed): the SQZ feed starts 2011-05-02, so the window is
# 2011-05..2026-06 and the 2010-04 + (most of the) 2011-04 tops are NOT fully covered.
# Of the 12 enumerated Phase-3 tops, those whose peak falls before ~2011-05 cannot be
# caught; the in-window subset is what gamma is judged on (fewer top episodes than the
# full Phase-3 set). The dealer-gamma signal is market-wide (SPX dealer positioning),
# so the QQQ transfer = the SAME gamma signal with QQQ's price for the trigger/outcome.
# =============================================================================

meta:
  project: volatility_regime_reversal_indicator
  phase: 5
  name: gamma
  builds_on: phase3_NO_GO
  ticker: SPY                          # SPY is primary; QQQ is the cross-asset hold-out
  frozen_before_confirmatory_run: true
  hypotheses_are_post_selected: true   # disclosed: chosen from research + theory, NOT re-tuned
  backtest_start: "2011-05-02"         # bound by the SQZ feed (gex/dix) start
  backtest_end: "2026-06-18"
  sqz_coverage_note: >
    SQZ (gex/dix) starts 2011-05-02; the 2010-04 top and the early-2011 top are NOT fully
    covered. The in-window subset of the 12 enumerated Phase-3 tops is what the gamma top
    detector is judged on — fewer episodes than the full Phase-3 set. Disclosed.
  ground_truth_top_episodes_8pct: 12   # reused from Phase-3; in-window subset is scored
  ground_truth_organic_excl_newscrash: 10
  ground_truth_in_scope_distribution: 7

# 1. PRIMARY HYPOTHESIS & METRIC -------------------------------------------------
primary:
  outcome: precision_vs_base_rate
  definition: >
    PRECISION = P(a real >=8% move occurs within 60 trading days | the construction fires),
    scored at episode-entry positions (collapse_episodes window=20), vs the OPPORTUNITY-SET
    base rate. The honest headline is always the RAW RATIO, never the percentage alone, because
    N is tiny (and smaller than Phase 3's, due to the 2011-05 SQZ start).
  horizon_trading_days: 20
  primary_tier_pct: 8
  early_is_acceptable: true

# 2. TARGET EVENTS (reused verbatim from Phase-3; ground truth unchanged) ---------
target_events:
  top: "a >=tier peak-to-trough drawdown within the 60-trading-day event window"
  bottom: "a >=tier trough-to-peak run-up within the 60-trading-day event window"
  event_window_trading_days: 60
  tiers_pct: [8, 15]
  primary_tier_pct: 8
  episode_list_top_8pct:
    - {peak: "2010-04-23", trough: "2010-07-02", depth: -0.157, scope: organic}
    - {peak: "2011-04-29", trough: "2011-10-03", depth: -0.186, scope: distribution}
    - {peak: "2012-04-02", trough: "2012-06-04", depth: -0.097, scope: distribution}
    - {peak: "2015-07-20", trough: "2016-02-11", depth: -0.130, scope: distribution}
    - {peak: "2018-01-26", trough: "2018-02-08", depth: -0.101, scope: fast}
    - {peak: "2018-09-20", trough: "2018-12-24", depth: -0.193, scope: distribution}
    - {peak: "2020-02-19", trough: "2020-03-23", depth: -0.337, scope: news_crash_excluded}
    - {peak: "2020-09-02", trough: "2020-09-23", depth: -0.094, scope: fast}
    - {peak: "2022-01-03", trough: "2022-10-12", depth: -0.245, scope: distribution}
    - {peak: "2024-07-16", trough: "2024-08-05", depth: -0.084, scope: fast}
    - {peak: "2025-02-19", trough: "2025-04-08", depth: -0.188, scope: distribution}
    - {peak: "2026-01-27", trough: "2026-03-30", depth: -0.089, scope: distribution}

# 3. MINIMUM EFFECT SIZE ---------------------------------------------------------
min_effect_size:
  precision_edge_pp: 20.0
  recall_floor_organic: 4
  alpha: 0.05
  note: "significance alone is insufficient; the precision edge AND raw recall both gate."

# 4. CONSTRUCTIONS (frozen; thresholds are round numbers from theory, NOT re-tuned) -----
constructions:
  features_gamma:                      # all point-in-time, src/signals/conditions_gamma.py
    neg_gamma_regime: "SQZ_gex < 0  (dealers amplify moves = fragile/top-like; canonical line)"
    low_gex_regime: "trailing_percentile(SQZ_gex,252) <= 0.20  (softer self-calibrating variant)"
    neg_gamma_ma: "sma(SQZ_gex,20) < 0  (persistently negative, not a one-day blip)"
    high_dix: "trailing_percentile(SQZ_dix,252) >= 0.90  (dark-pool accumulation = bottom-like)"
  legs_top:
    g_neg_gamma_break: "neg_gamma_regime AND support_break(SPY_close,50)  (fragile STATE + price EVENT)"
  legs_bottom:
    g_dix_capitulation: "high_dix(0.90) AND washout within 25d (Phase-2 _capit -0.08/0.90)"
  grid:                                # the CONFIRMATORY multiple-testing budget (frozen)
    G_neg_gamma_break: {legs: [gex<0, support_break sma50], variants: 2}  # +low_gex_break, +ma-neg-gamma
    G_dix_capitulation: {legs: [high_dix>=0.90, washout within 25d], variants: 1}  # +neg-gamma-capit
    total_confirmatory_cells: 5
  controls:                            # NOT in the predictive budget; prove the trigger/sequence matters
    - ctl_neg_gamma_only               # negative-gamma regime alone, no price break
    - ctl_dix_only                     # high dix alone, no washout
  benchmark:                           # reused from Phase-3 (G6 battle)
    bench_top_200: "SPY breaks DOWN through its 200-day MA"
    bench_bot_200: "SPY reclaims its 200-day MA from below"

# 5. EPISODE COLLAPSING ----------------------------------------------------------
episodes:
  window_trading_days: 20
  rule: "same-side alerts within 20 trading days collapse to one episode; first alert is the entry."
  report: [episode_count, effective_n, raw_ratio]

# 6. ALERT BUDGET — 'earn the right to speak rarely' -----------------------------
alert_budget:
  tops_per_year: {min: 2, max: 4}
  bottoms_per_year: {min: 1, max: 3}
  enforcement: >
    G7 enforces the MAX cap: a construction whose mean COLLAPSED episodes/year exceeds its cap
    FAILS regardless of precision. Firing BELOW the min is allowed but REPORTED as
    'quiet/underpowered'.
  rationale: "pre-registered to stop precision being bought with a flood of alerts."

# 7. NULL MODEL — the load-bearing upgrade (reused from Phase-2/3) ----------------
null_model:
  type: opportunity_set_random_timing
  rule: >
    The random-timing null draws ONLY from the ELIGIBLE opportunity set (near-high days for
    tops; >=5% pullback days for bottoms), regime-matched, NOT from all days. The construction
    must beat THIS harder null.
  eligibility_top: "near_high (SPY within 3% of its 60d high)"
  eligibility_bottom: "drawdown(SPY_close,60) <= -0.05 (already in a meaningful pullback)"
  draws: 2000
  seed: 1729
  also_report: regime_matched_all_days_null

# 8. OUT-OF-SAMPLE BATTERY (reused from Phase-2/3) -------------------------------
out_of_sample:
  temporal_holdout:
    discover_window: ["2011-05-02", "2021-12-31"]
    confirm_window:  ["2022-01-01", "2026-06-18"]
    rule: "edge must be present (same sign, positive) in the CONFIRM window, not only pooled."
  cross_asset_transfer:
    asset: QQQ
    rule: >
      Apply the frozen gamma constructions to QQQ with NO re-tuning. The SQZ gex/dix are
      market-wide (SPX dealer positioning), so the transfer = the SAME gamma signal with QQQ's
      PRICE for the trigger and the outcome. The edge must beat QQQ's own opportunity-set null.
      Failure on the untouched asset => the SPY edge is a noise-fit. THIS is the binding
      constraint that killed Phase 2 (QQQ edge -0.028) and Phase 3.
    note: "QQQ price used for support_break + the forward outcome; gex/dix unchanged (market-wide)."
  leave_one_episode_out:
    rule: >
      Drop each enumerated top (in-window), recompute recall on the rest; pass only if recall
      holds in a MAJORITY of leave-outs AND no single episode's removal collapses precision below
      base.

# 9. MULTIPLE-TESTING ------------------------------------------------------------
multiple_testing:
  confirmatory_grid: max_statistic_reality_check
  fdr: benjamini_hochberg
  exploratory_disclosure: >
    Thresholds are round canonical values (gex<0, 0.20/0.90 percentiles, 20/50-day MAs), NOT
    swept. The OOS battery (section 8) — especially the QQQ transfer — not the in-sample
    reality_p, is the primary evidence for a GO.
  deflated_sharpe: false

# 10. KILL-GATE PHASE-GAMMA (all 7 must hold for a GO) ---------------------------
kill_gate:
  conditions:
    - "G1 precision floor: primary precision >= opportunity-set base + 20pp AND null_p < 0.05"
    - "G2 confirmatory MTC: max-stat reality_p < 0.05 across the frozen cells AND BH survivors > 0"
    - "G3 out-of-sample: CONFIRM-window edge positive AND QQQ transfer beats QQQ null AND LOEO recall holds with no single-episode precision collapse"
    - "G4 recall floor: catches >= 4 of the in-window organic tops (pre-2011-05 tops noted, not counted against)"
    - "G5 stack beats parts: gated construction precision > each control (neg_gamma_only, dix_only) at MATCHED alert count (bootstrap CI on the difference excludes 0)"
    - "G6 benchmark battle: the detector beats the late-but-robust 200-day trend baseline at MATCHED alert count (diff_p05 > 0), for BOTH sides"
    - "G7 alert budget: mean collapsed episodes/year <= the pre-registered cap (tops 4, bottoms 3) for BOTH sides"
  on_fail: >
    STOP and report 'no demonstrable edge' — ship DESCRIPTIVE-ONLY (display where dealer gamma /
    dark-pool dix stand today, no predictive-confidence claim, no live alert). An honest,
    successful, anticipated outcome.
  suggestive_band: "an opportunity-set null_p in [0.05, 0.10] is SUGGESTIVE ONLY and does NOT flip the tool ON."

# 11. STRUCTURAL BOUNDARIES ------------------------------------------------------
structural_breaks:
  declared: {SQZ_start: "2011-05-02", QQQE_start: "2012-03-21", ABINYSE_start: "2010-01-04"}
  rule: "no rolling window may straddle an availability boundary; the 2011-05 SQZ start is the binding one."
  top_coverage: "gex<0 is same-day (no warmup); low_gex/neg_gamma_ma/high_dix need a 252d / 20d trailing window."

reproducibility:
  random_seed: 1729
  data_snapshot: "SQZ committed; gex/dix are market-wide SPX dealer positioning."
