services:

  searxng:
    image: searxng/searxng:latest
    container_name: openclaw-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    # Steady-state SearXNG usage on this workload is ~200 MB. 2 GB gives
    # ~10× headroom for query bursts and long-running caches while still
    # bounding a runaway memory leak from taking down the whole 7.5 GB host.
    # Disk has its own limits; this knob is RAM only.
    mem_limit: 2g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
