[pytest]
asyncio_mode = auto
markers =
    live: marks tests that hit live network (YouTube, Gemini, Groq). Opt-in via OMC_LIVE_TESTS=1 and -m live.
    smoke: item-F go-live smoke tests (hit a live provider). Run only by the flag-flip gate on a flip; excluded from the routine suite.
addopts = -m "not live and not smoke" --strict-markers
