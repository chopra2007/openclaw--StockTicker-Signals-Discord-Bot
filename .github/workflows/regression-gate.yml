name: Regression Gate

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        id: suite
        run: |
          # pytest exits non-zero whenever the suite is red — which is the
          # expected baseline state. Under GitHub's default `bash -e` shell
          # that non-zero exit would abort the step before the baseline
          # comparison ever runs, so the gate could never pass. `|| true`
          # keeps the step alive; the `Compare against baseline` step below
          # is what actually decides pass/fail.
          OUTPUT=$(python3 -m pytest tests/ -q --tb=no -p no:cacheprovider 2>&1) || true
          echo "$OUTPUT"
          SUMMARY=$(echo "$OUTPUT" | grep -E '[0-9]+ (passed|failed|error)' | tail -1 || true)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

          # Extract failing test IDs. The sed strips the leading FAILED/ERROR
          # marker AND the trailing " - <reason>" suffix pytest 9 appends to
          # short-summary lines — that suffix is environment-dependent (it is
          # truncated to terminal width) and would never match the bare node
          # ids in .test-baseline. grep exits 1 on an all-green suite, so
          # tolerate it and still emit an (empty) failures file.
          echo "$OUTPUT" | grep -E '^(FAILED|ERROR) ' | sed -E 's/^(FAILED|ERROR) //; s/ - .*$//' | sort -u > /tmp/current_failures.txt || true
          echo "failed_count=$(wc -l < /tmp/current_failures.txt)" >> $GITHUB_OUTPUT

      - name: Compare against baseline
        id: gate
        run: |
          # Normalize the baseline the same way (strip any " - <reason>"
          # suffix) so a baseline captured in either environment compares
          # cleanly against /tmp/current_failures.txt.
          sed -E 's/ - .*$//' .test-baseline | sort -u > /tmp/baseline.txt
          NEW=$(comm -13 /tmp/baseline.txt /tmp/current_failures.txt)
          FIXED=$(comm -23 /tmp/baseline.txt /tmp/current_failures.txt)

          if [ -n "$NEW" ]; then
            echo "status=FAILED" >> $GITHUB_OUTPUT
            # Truncate to 5 lines for Discord readability
            TRUNCATED=$(echo "$NEW" | head -5)
            COUNT=$(echo "$NEW" | wc -l)
            echo "new_failures<<EOF" >> $GITHUB_OUTPUT
            echo "$TRUNCATED" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 5 ]; then echo "...and $((COUNT - 5)) more" >> $GITHUB_OUTPUT; fi
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "status=PASSED" >> $GITHUB_OUTPUT
            echo "new_failures=" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIXED" ]; then
            FIXED_COUNT=$(echo "$FIXED" | wc -l)
            echo "fixed_count=$FIXED_COUNT" >> $GITHUB_OUTPUT
          else
            echo "fixed_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord (pass, only when tests newly fixed)
        if: steps.gate.outputs.status == 'PASSED' && steps.gate.outputs.fixed_count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_SHORT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHORT:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          FIXED_COUNT="${{ steps.gate.outputs.fixed_count }}"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **Regression gate passed** — \`$COMMIT_SHORT\` $COMMIT_MSG | $FIXED_COUNT test(s) newly fixed — run \`make test-baseline\`\", \"username\": \"CI\"}"

      - name: Notify Discord (fail)
        if: steps.gate.outputs.status == 'FAILED'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_SHORT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHORT:0:7}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          NEW_FAILURES="${{ steps.gate.outputs.new_failures }}"
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **Regression gate FAILED** — \`$COMMIT_SHORT\` $COMMIT_MSG\nNew test failures:\n\`\`\`\n$NEW_FAILURES\n\`\`\`\", \"username\": \"CI\"}"

      - name: Fail the job if gate blocked
        if: steps.gate.outputs.status == 'FAILED'
        run: exit 1
