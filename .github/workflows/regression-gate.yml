name: Regression Gate

on:
  push:
    branches: [master]
  # Also run on every pull request, so a PR has a real pass/fail check to gate on.
  # Session close (todo/SESSION_CLOSE.md) waits for this check and merges only if it passes.
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        id: suite
        run: |
          # pytest exits non-zero whenever the suite is red — which is the
          # expected baseline state. Under GitHub's default `bash -e` shell
          # that non-zero exit would abort the step before the baseline
          # comparison ever runs, so the gate could never pass. Keep ordinary
          # test failures for baseline comparison, but surface pytest errors.
          set +e
          OUTPUT=$(python3 -m pytest tests/ -q --tb=no -p no:cacheprovider 2>&1)
          TEST_EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ "$TEST_EXIT" -gt 1 ]; then
            echo "pytest failed before baseline comparison (exit $TEST_EXIT)" >&2
            exit "$TEST_EXIT"
          fi
          SUMMARY=$(echo "$OUTPUT" | grep -E '[0-9]+ (passed|failed|error)' | tail -1 || true)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

          # Extract failing test IDs. The sed strips the leading FAILED/ERROR
          # marker AND the trailing " - <reason>" suffix pytest 9 appends to
          # short-summary lines — that suffix is environment-dependent (it is
          # truncated to terminal width) and would never match the bare node
          # ids in .test-baseline. grep exits 1 on an all-green suite, so
          # tolerate it and still emit an (empty) failures file.
          echo "$OUTPUT" | grep -E '^(FAILED|ERROR) ' | sed -E 's/^(FAILED|ERROR) //; s/ - .*$//' | sort -u > /tmp/current_failures.txt || true
          echo "failed_count=$(wc -l < /tmp/current_failures.txt)" >> $GITHUB_OUTPUT

      - name: Compare against baseline
        id: gate
        run: |
          # Normalize the baseline the same way (strip any " - <reason>"
          # suffix) so a baseline captured in either environment compares
          # cleanly against /tmp/current_failures.txt.
          sed -E 's/ - .*$//' .test-baseline | sort -u > /tmp/baseline.txt
          NEW=$(comm -13 /tmp/baseline.txt /tmp/current_failures.txt)
          FIXED=$(comm -23 /tmp/baseline.txt /tmp/current_failures.txt)

          if [ -n "$NEW" ]; then
            echo "status=FAILED" >> $GITHUB_OUTPUT
            # Truncate to 5 lines for Discord readability
            TRUNCATED=$(echo "$NEW" | head -5)
            COUNT=$(echo "$NEW" | wc -l)
            echo "new_failures<<EOF" >> $GITHUB_OUTPUT
            echo "$TRUNCATED" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 5 ]; then echo "...and $((COUNT - 5)) more" >> $GITHUB_OUTPUT; fi
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "status=PASSED" >> $GITHUB_OUTPUT
            echo "new_failures=" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIXED" ]; then
            FIXED_COUNT=$(echo "$FIXED" | wc -l)
            echo "fixed_count=$FIXED_COUNT" >> $GITHUB_OUTPUT
          else
            echo "fixed_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Notify Discord (fail)
        if: ${{ failure() || steps.gate.outputs.status == 'FAILED' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
          NEW_FAILURES: ${{ steps.gate.outputs.new_failures }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from http.client import HTTPException
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen


          def main():
              if os.environ.get("GATE_STATUS") == "PASSED":
                  return 0

              webhook = os.environ.get("DISCORD_WEBHOOK_URL")
              if not webhook:
                  print("Discord notification failed: webhook secret is missing", file=sys.stderr)
                  return 1

              sha = os.environ.get("GITHUB_SHA", "")[:7]
              run_url = (
                  f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/"
                  f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
                  f"{os.environ.get('GITHUB_RUN_ID', '')}"
              )
              failures = os.environ.get("NEW_FAILURES", "").strip()
              content = f"Regression gate failed ({sha}). {run_url}"
              if failures:
                  content += f"\nNew test failures:\n{failures}"
              payload = json.dumps(
                  {"content": content[:1900], "username": "CI", "allowed_mentions": {"parse": []}}
              ).encode("utf-8")
              try:
                  request = Request(webhook, data=payload, headers={"Content-Type": "application/json"})
                  with urlopen(request, timeout=10):
                      pass
              except HTTPError as error:
                  print(f"Discord notification failed: HTTP {error.code}", file=sys.stderr)
                  return 1
              except (HTTPException, URLError, TimeoutError, ValueError):
                  print("Discord notification failed: request error", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Fail the job if gate blocked
        if: steps.gate.outputs.status == 'FAILED'
        run: exit 1
